<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil — MC Addon Share</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="logo.png" type="image/png">
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
</head>
<body>
<header class="header-tetap">
    <div class="container header-dalam">
        <a href="index.html" class="logo-web">
            <img src="logo.png" alt="MC Addon Share">
            <span>MC Addon Share</span>
        </a>
    </div>
</header>

<main class="konten-utama">
<section class="halaman-detail">
    <div class="container">
        <div class="kartu-detail">
            <div class="detail-isi profil-halaman" id="profil-app">
                <div class="profil-avatar"><i class="fa fa-user"></i></div>
                <h2>Profil</h2>
                <p class="detail-deskripsi">Memeriksa akun...</p>
            </div>
        </div>
    </div>
</section>
</main>

<nav class="navigasi-bawah" aria-label="Navigasi utama">
    <a href="index.html" class="nav-item" data-nav="beranda"><i class="fa fa-home"></i><span>Beranda</span></a>
    <a href="index.html#kotak-cari" class="nav-item" data-nav="cari"><i class="fa fa-search"></i><span>Cari</span></a>
    <a href="index.html#wadah-addon" class="nav-item" data-nav="disukai"><i class="fa fa-thumbs-up"></i><span>Disukai</span></a>
    <a href="profil.html" class="nav-item aktif" data-nav="profil"><i class="fa fa-user"></i><span>Profil</span></a>
</nav>

<script type="module">
import {
  auth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  signOut,
  onAuthStateChanged,
  setPersistence,
  browserLocalPersistence,
  normalisasiUsername,
  validasiUsername,
  usernameKeEmail,
  emailKeUsername
} from "./auth.js";

const appEl = document.getElementById("profil-app");
let mode = "login";

function escapeHtml(value) {
  return String(value).replace(/[&<>'"]/g, ch => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;", "'":"&#39;", '"':"&quot;"
  }[ch]));
}

function pesanError(error) {
  const code = error?.code || "";
  const raw = error?.message || "";
  if (code.includes("email-already-in-use")) return "Username tersebut sudah digunakan.";
  if (code.includes("invalid-credential") || code.includes("wrong-password") || code.includes("user-not-found")) return "Username atau password salah.";
  if (code.includes("weak-password")) return "Password terlalu lemah. Gunakan minimal 6 karakter.";
  if (code.includes("too-many-requests")) return "Terlalu banyak percobaan. Coba lagi beberapa saat.";
  if (code.includes("invalid-email")) return "Format akun internal tidak diterima Firebase. Kode: " + code;
  if (code.includes("operation-not-allowed")) return "Metode Email/Password belum diizinkan di Firebase. Aktifkan lagi di Authentication → Sign-in method.";
  if (code.includes("network-request-failed")) return "Koneksi ke Firebase gagal. Periksa internet/CDN.";
  if (code.includes("invalid-api-key") || code.includes("app-not-authorized") || code.includes("api-key-not-valid")) return "Konfigurasi/API key Firebase ditolak. Kode: " + code;
  if (code.includes("unauthorized-domain")) return "Domain ini belum diizinkan Firebase. Tambahkan localhost di Authentication → Settings → Authorized domains.";
  return `Firebase: ${code || "unknown-error"}${raw ? " — " + raw : ""}`;
}

function tampilForm(judul, teksTombol) {
  appEl.innerHTML = `
    <div class="profil-avatar"><i class="fa fa-user"></i></div>
    <h2>${judul}</h2>
    <p class="profil-subjudul">${mode === "login" ? "Masuk ke akun MC Addon Share" : "Buat akun baru di MC Addon Share"}</p>
    <form id="form-akun" class="form-akun" novalidate>
      <label for="username">Username</label>
      <input id="username" name="username" type="text" minlength="3" maxlength="20" autocomplete="username" placeholder="Contoh: Steve_123" required>
      <small>3–20 karakter: huruf, angka, dan garis bawah (_).</small>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" minlength="6" autocomplete="current-password" placeholder="Minimal 6 karakter" required>
      <div id="pesan-akun" class="pesan-akun" role="alert"></div>
      <button class="tombol-utama tombol-akun" type="submit">${teksTombol}</button>
    </form>
    <button id="ganti-mode" class="tombol-sekunder" type="button">
      ${mode === "login" ? "Belum punya akun? Daftar" : "Sudah punya akun? Masuk"}
    </button>
  `;

  document.getElementById("ganti-mode").addEventListener("click", () => {
    mode = mode === "login" ? "register" : "login";
    tampilForm(mode === "login" ? "Masuk" : "Daftar", mode === "login" ? "Masuk" : "Daftar");
  });

  document.getElementById("form-akun").addEventListener("submit", async (event) => {
    event.preventDefault();
    const username = normalisasiUsername(document.getElementById("username").value);
    const password = document.getElementById("password").value;
    const pesan = document.getElementById("pesan-akun");

    if (!validasiUsername(username)) {
      pesan.textContent = "Username harus 3–20 karakter dan hanya boleh huruf, angka, atau _.";
      return;
    }
    if (password.length < 6) {
      pesan.textContent = "Password minimal 6 karakter.";
      return;
    }

    const tombol = document.querySelector(".tombol-akun");
    tombol.disabled = true;
    tombol.textContent = mode === "login" ? "Memproses..." : "Membuat akun...";
    pesan.textContent = "";

    try {
      const emailInternal = usernameKeEmail(username);
      if (mode === "register") {
        await createUserWithEmailAndPassword(auth, emailInternal, password);
      } else {
        await signInWithEmailAndPassword(auth, emailInternal, password);
      }
    } catch (error) {
      console.error("Firebase Auth:", error);
      pesan.textContent = pesanError(error);
      tombol.disabled = false;
      tombol.textContent = mode === "login" ? "Masuk" : "Daftar";
    }
  });
}

function tampilProfil(user) {
  const username = emailKeUsername(user.email);
  appEl.innerHTML = `
    <div class="profil-avatar"><i class="fa fa-user"></i></div>
    <h2>Profil</h2>
    <div class="profil-akun-login">
      <div class="profil-nama">@${escapeHtml(username)}</div>
      <div class="profil-status"><i class="fa fa-check-circle"></i> Sudah login</div>
    </div>
    <div class="detail-info">
      <div class="info-item"><span>Username</span>@${escapeHtml(username)}</div>
      <div class="info-item"><span>Status</span>Aktif</div>
    </div>
    <button id="logout" class="tombol-logout" type="button"><i class="fa fa-sign-out"></i> Logout</button>
  `;
  document.getElementById("logout").addEventListener("click", async () => {
    try {
      await signOut(auth);
    } catch (error) {
      alert("Gagal logout. Coba lagi.");
    }
  });
}

function tampilErrorFirebase() {
  appEl.innerHTML = `
    <div class="profil-avatar"><i class="fa fa-exclamation-triangle"></i></div>
    <h2>Profil</h2>
    <p class="detail-deskripsi">Firebase gagal dimuat.</p>
    <p class="detail-deskripsi"><small>Pastikan internet aktif dan halaman dijalankan melalui server (localhost atau hosting), bukan dibuka langsung sebagai file.</small></p>
    <button id="coba-lagi" class="tombol-utama tombol-akun" type="button">Coba Lagi</button>
  `;
  document.getElementById("coba-lagi").addEventListener("click", () => location.reload());
}

try {
  onAuthStateChanged(auth, (user) => {
    if (user) tampilProfil(user);
    else tampilForm("Masuk", "Masuk");
  });
} catch (error) {
  console.error("Firebase Auth gagal:", error);
  tampilErrorFirebase();
}
</script>
</body>
</html>
