<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil — MC Addon Share</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="logo.png" type="image/png">
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
<style>
.profil-statistik{max-width:420px;margin:16px auto;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.profil-stat-item{padding:14px 8px;background:#181818;border:1px solid #333;border-radius:12px;display:flex;flex-direction:column;gap:5px;align-items:center;min-width:0}
.profil-stat-item strong{font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.profil-stat-item span{font-size:12px;color:#999}
.profil-role-label{color:#aaa;font-size:13px;margin:2px 0 8px}
.profil-disukai-link{box-sizing:border-box;text-decoration:none;border:1px solid #333!important}
@media(max-width:420px){.profil-statistik{gap:7px}.profil-stat-item{padding:12px 5px}.profil-stat-item strong{font-size:16px}}
</style>
</head>
<body>
<header class="header-tetap">
    <div class="container header-dalam">
        <a href="index.html" class="logo-web">
            <img src="logo.png" alt="MC Addon Share">
            <span>MC Addon Share</span>
        </a>
    </div>
</header>

<main class="konten-utama">
<section class="halaman-detail">
    <div class="container">
        <div class="kartu-detail">
            <div class="detail-isi profil-halaman" id="profil-app">
                <div class="profil-avatar"><i class="fa fa-user"></i></div>
                <h2>Profil</h2>
                <p class="detail-deskripsi">Memeriksa akun...</p>
            </div>
        </div>
    </div>
</section>
</main>

<nav class="navigasi-bawah" aria-label="Navigasi utama">
    <a href="index.html" class="nav-item" data-nav="beranda"><i class="fa fa-home"></i><span>Beranda</span></a>
    <a href="index.html#kotak-cari" class="nav-item" data-nav="cari"><i class="fa fa-search"></i><span>Cari</span></a>
    <a href="index.html#wadah-addon" class="nav-item" data-nav="disukai"><i class="fa fa-thumbs-up"></i><span>Disukai</span></a>
    <a href="profil.html" class="nav-item aktif" data-nav="profil"><i class="fa fa-user"></i><span>Profil</span></a>
</nav>

<script type="module">
import {
  auth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  signOut,
  onAuthStateChanged,
  normalisasiUsername,
  validasiUsername,
  usernameKeEmail,
  emailKeUsername,
  ambilRole
} from "./auth.js";

const appEl = document.getElementById("profil-app");
let mode = "login";
let jenisLogin = "user";

function escapeHtml(value) {
  return String(value).replace(/[&<>'"]/g, ch => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;", "'":"&#39;", '"':"&quot;"
  }[ch]));
}

function pesanError(error) {
  const code = error?.code || "";
  const raw = error?.message || "";
  if (code.includes("email-already-in-use")) return "Akun tersebut sudah digunakan.";
  if (code.includes("invalid-credential") || code.includes("wrong-password") || code.includes("user-not-found")) return "Akun atau password salah.";
  if (code.includes("weak-password")) return "Password terlalu lemah. Gunakan minimal 6 karakter.";
  if (code.includes("too-many-requests")) return "Terlalu banyak percobaan. Coba lagi beberapa saat.";
  if (code.includes("invalid-email")) return "Format email tidak valid.";
  if (code.includes("operation-not-allowed")) return "Metode Email/Password belum diizinkan di Firebase.";
  if (code.includes("network-request-failed")) return "Koneksi ke Firebase gagal. Periksa internet/CDN.";
  if (code.includes("invalid-api-key") || code.includes("app-not-authorized") || code.includes("api-key-not-valid")) return "Konfigurasi/API key Firebase ditolak. Kode: " + code;
  if (code.includes("unauthorized-domain")) return "Domain ini belum diizinkan Firebase. Tambahkan domain website di Firebase Authentication.";
  return `Firebase: ${code || "unknown-error"}${raw ? " — " + raw : ""}`;
}

function pilihJenisLogin(jenis) {
  jenisLogin = jenis;
  mode = "login";
  tampilForm("Masuk", "Masuk");
}

function tampilForm(judul, teksTombol) {
  const staf = jenisLogin === "staff";
  appEl.innerHTML = `
    <div class="profil-avatar"><i class="fa ${staf ? "fa-shield" : "fa-user"}"></i></div>
    <h2>${judul}</h2>
    <p class="profil-subjudul">${staf ? "Login Admin / Owner MC Addon Share" : (mode === "login" ? "Masuk ke akun MC Addon Share" : "Buat akun pengguna baru")}</p>

    <div class="pilihan-login" role="tablist" aria-label="Jenis login">
      <button type="button" class="${!staf ? "aktif" : ""}" id="login-user">User</button>
      <button type="button" class="${staf ? "aktif" : ""}" id="login-staff">Admin / Owner</button>
    </div>

    <form id="form-akun" class="form-akun" novalidate>
      ${staf ? `
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" placeholder="Email Admin / Owner" required>
      ` : `
        <label for="username">Username</label>
        <input id="username" name="username" type="text" minlength="3" maxlength="20" autocomplete="username" placeholder="Contoh: Steve_123" required>
        <small>3–20 karakter: huruf, angka, dan garis bawah (_).</small>
      `}
      <label for="password">Password</label>
      <input id="password" name="password" type="password" minlength="6" autocomplete="${staf ? "current-password" : "current-password"}" placeholder="Minimal 6 karakter" required>
      <div id="pesan-akun" class="pesan-akun" role="alert"></div>
      <button class="tombol-utama tombol-akun" type="submit">${teksTombol}</button>
    </form>

    ${!staf ? `
      <button id="ganti-mode" class="tombol-sekunder" type="button">
        ${mode === "login" ? "Belum punya akun? Daftar" : "Sudah punya akun? Masuk"}
      </button>
      <p class="catatan-staf"><i class="fa fa-info-circle"></i> Admin dan Owner tidak mendaftar dari halaman ini.</p>
    ` : `
      <button id="kembali-user" class="tombol-sekunder" type="button">Kembali ke login User</button>
      <p class="catatan-staf"><i class="fa fa-lock"></i> Akses Admin / Owner hanya untuk akun yang telah diberi role.</p>
    `}
  `;

  document.getElementById("login-user").addEventListener("click", () => pilihJenisLogin("user"));
  document.getElementById("login-staff").addEventListener("click", () => pilihJenisLogin("staff"));

  if (staf) {
    document.getElementById("kembali-user").addEventListener("click", () => pilihJenisLogin("user"));
  } else {
    document.getElementById("ganti-mode").addEventListener("click", () => {
      mode = mode === "login" ? "register" : "login";
      tampilForm(mode === "login" ? "Masuk" : "Daftar", mode === "login" ? "Masuk" : "Daftar");
    });
  }

  document.getElementById("form-akun").addEventListener("submit", async (event) => {
    event.preventDefault();
    const password = document.getElementById("password").value;
    const pesan = document.getElementById("pesan-akun");

    if (password.length < 6) {
      pesan.textContent = "Password minimal 6 karakter.";
      return;
    }

    let akunLogin;
    if (staf) {
      akunLogin = document.getElementById("email").value.trim();
      if (!akunLogin || !akunLogin.includes("@")) {
        pesan.textContent = "Masukkan email Admin atau Owner.";
        return;
      }
    } else {
      akunLogin = normalisasiUsername(document.getElementById("username").value);
      if (!validasiUsername(akunLogin)) {
        pesan.textContent = "Username harus 3–20 karakter dan hanya boleh huruf, angka, atau _.";
        return;
      }
    }

    const tombol = document.querySelector(".tombol-akun");
    tombol.disabled = true;
    tombol.textContent = mode === "login" ? "Memproses..." : "Membuat akun...";
    pesan.textContent = "";

    try {
      if (staf) {
        await signInWithEmailAndPassword(auth, akunLogin, password);
      } else {
        const emailInternal = usernameKeEmail(akunLogin);
        if (mode === "register") {
          await createUserWithEmailAndPassword(auth, emailInternal, password);
        } else {
          await signInWithEmailAndPassword(auth, emailInternal, password);
        }
      }
    } catch (error) {
      console.error("Firebase Auth:", error);
      pesan.textContent = pesanError(error);
      tombol.disabled = false;
      tombol.textContent = mode === "login" ? "Masuk" : "Daftar";
    }
  });
}

function badgeRole(role) {
  const map = {
    user: ["User", "fa-user"],
    admin: ["Admin", "fa-shield"],
    owner: ["Owner", "fa-star"]
  };
  const [label, icon] = map[role] || map.user;
  return `<span class="badge-role role-${role}"><i class="fa ${icon}"></i> ${label}</span>`;
}

function tampilProfil(user, role) {
  const isStaff = role === "admin" || role === "owner";
  const nama = isStaff ? (user.email || "") : emailKeUsername(user.email);
  const likeKey = `sudahLike_${user.uid}`;
  let jumlahDisukai = 0;
  try {
    const dataLike = JSON.parse(localStorage.getItem(likeKey) || "[]");
    jumlahDisukai = Array.isArray(dataLike) ? dataLike.length : 0;
  } catch (_) {
    jumlahDisukai = 0;
  }
  const labelAkun = role === "owner" ? "Pemilik" : role === "admin" ? "Staf Admin" : "Anggota";

  appEl.innerHTML = `
    <div class="profil-avatar"><i class="fa ${isStaff ? "fa-shield" : "fa-user"}"></i></div>
    <h2>Profil</h2>
    <div class="profil-akun-login">
      <div class="profil-nama">${isStaff ? escapeHtml(nama) : "@" + escapeHtml(nama)}</div>
      <div class="profil-status"><i class="fa fa-check-circle"></i> Akun aktif</div>
      <div class="profil-role-label">${escapeHtml(labelAkun)}</div>
      ${badgeRole(role)}
    </div>
    <div class="profil-statistik">
      <div class="profil-stat-item"><strong>${jumlahDisukai}</strong><span>Disukai</span></div>
      <div class="profil-stat-item"><strong>${role === "owner" ? "Owner" : role === "admin" ? "Admin" : "User"}</strong><span>Role</span></div>
      <div class="profil-stat-item"><strong>Aktif</strong><span>Status</span></div>
    </div>
    <div class="detail-info">
      <div class="info-item"><span>Username / akun</span>${isStaff ? escapeHtml(nama) : "@" + escapeHtml(nama)}</div>
      <div class="info-item"><span>Jenis akun</span>${role === "owner" ? "Owner" : role === "admin" ? "Admin" : "User"}</div>
    </div>
    <a href="index.html#wadah-addon" class="tombol-sekunder profil-disukai-link"><i class="fa fa-thumbs-up"></i> Lihat addon disukai</a>
    ${role === "admin" ? `<a href="admin.html" class="tombol-utama tombol-akun"><i class="fa fa-dashboard"></i> Panel Admin</a>` : ""}
    ${role === "owner" ? `
      <a href="admin.html" class="tombol-utama tombol-akun"><i class="fa fa-dashboard"></i> Panel Admin</a>
      <a href="owner.html" class="tombol-utama tombol-akun tombol-owner"><i class="fa fa-star"></i> Panel Owner</a>
    ` : ""}
    <button id="logout" class="tombol-logout" type="button"><i class="fa fa-sign-out"></i> Logout</button>
  `;

  document.getElementById("logout").addEventListener("click", async () => {
    try {
      await signOut(auth);
    } catch (error) {
      alert("Gagal logout. Coba lagi.");
    }
  });
}

function tampilErrorFirebase() {
  appEl.innerHTML = `
    <div class="profil-avatar"><i class="fa fa-exclamation-triangle"></i></div>
    <h2>Profil</h2>
    <p class="detail-deskripsi">Firebase gagal dimuat.</p>
    <button id="coba-lagi" class="tombol-utama tombol-akun" type="button">Coba Lagi</button>
  `;
  document.getElementById("coba-lagi").addEventListener("click", () => location.reload());
}

onAuthStateChanged(auth, async (user) => {
  try {
    if (user) {
      const role = await ambilRole(user);
      tampilProfil(user, role);
    } else {
      tampilForm("Masuk", "Masuk");
    }
  } catch (error) {
    console.error("Role/Auth gagal:", error);
    tampilErrorFirebase();
  }
});
</script>
</body>
</html>
