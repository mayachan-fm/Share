<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detail Addon</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="dekorasi-atas"></div>

<header class="header">
    <div class="container">
        <a href="index.html" class="tombol-kembali">
            <i class="fa fa-arrow-left"></i> Kembali
        </a>
    </div>
</header>

<section class="halaman-detail">
    <div class="container">
        <div id="isi-detail">
            <div class="pesan-kosong">
                <i class="fa fa-spinner fa-spin"></i>
                <p>Memuat data...</p>
            </div>
        </div>

        <!-- KARTU BARU KHUSUS KOMENTAR -->
        <div class="kartu-komentar" id="wadah-komentar">
            <h3 class="judul-komentar"><i class="fa fa-comment"></i> Komentar</h3>
            
            <div class="form-komentar">
                <textarea id="input-komentar" placeholder="Tulis komentarmu disini..." maxlength="300"></textarea>
                <div class="batas-karakter">
                    <span id="jumlah-karakter">0/300</span>
                    <button id="tombol-kirim" class="tombol-unduh">Kirim</button>
                </div>
            </div>

            <div id="daftar-komentar">
                <div class="pesan-kosong-komentar">Belum ada komentar, jadilah yang pertama!</div>
            </div>
        </div>
        <!-- AKHIR KARTU KOMENTAR -->
    </div>
</section>

<footer class="footer">
    <div class="container">
        <p>© 2026 MC Addon Share</p>
    </div>
</footer>

<div id="notif-salin" class="notifikasi">✅ Link disalin ke papan klip!</div>
<div id="notif-komen" class="notifikasi">✅ Komentar berhasil dikirim!</div>

<link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
<script type="module" src="detail.js"></script>
</body>
</html>
